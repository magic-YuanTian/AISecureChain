  theregister-google-fixes-cvss:
    notes: >-
      No CVE yet (GHSA on page); minted AISC ok. Match via title_any on title/description/vuln_id —
      minted ids are NOT excluded. One required finding (headless/.gemini trust RCE); --yolo allowlist
      change is acceptable second row.
    url: https://www.theregister.com/patches/2026/04/30/google-fixes-cvss-100-vulnerability-in-gemini-cli/5225768
    classes:
      Vulnerability:
        required:
          # Any mint whose title/desc mentions the core bug counts as the one required finding.
          - {title_any: [".gemini", "headless", "workspace trust", "environment variable", "gemini cli"]}
        acceptable:
          - {title_any: ["yolo", "allowlist"]}
          # page links GHSA-wpqr-6v78-jr5g — ok if extract surfaces it
          - {id: "GHSA-wpqr-6v78-jr5g"}
      Vendor:
        required:
          - {name: "Google"}
        acceptable:
          - {name: "Novee", aliases: ["Novee Security"]}
          - {name: "Pillar Security", aliases: ["Pillar"]}
      Software:
        required:
          - {name: "Gemini CLI", aliases: ["Google Gemini CLI"]}
        acceptable:
          - {name: "run-gemini-cli GitHub Action", aliases: ["run-gemini-cli", "Gemini CLI Action"]}
      Attack:
        # Meged: not prompt injection — infrastructure trusted-config / CI supply-chain framing
        acceptable:
          - {name: "Code Injection"}
          - {name: "Supply Chain Attack"}
      Impact:
        required:
          - {name: "Remote Code Execution", aliases: ["Arbitrary Code Execution"]}
        acceptable:
          - {name: "Credential Theft"}
          - {name: "Information Disclosure"}

  securityweek-claude-code-gemini:
    notes: >-
      Comment and Control — one PI pattern across three agents (minted AISC ok).
      Do not accept remediation commentary (“overly broad tool access”) as a second vuln,
      or generic “security review agent” as Software.
    url: https://www.securityweek.com/claude-code-gemini-cli-github-copilot-agents-vulnerable-to-prompt-injection-via-comments/
    classes:
      Vulnerability:
        required:
          # Named pattern on page; mint title/desc with these keywords satisfies.
          - {title_any: ["comment and control"]}
        acceptable:
          # Product-split rows for the same pattern are fine; remediation-as-vuln is not.
          - {title_any: ["prompt injection", "github comment", "pr title", "issue comment"]}
      Vendor:
        required:
          - {name: "Anthropic"}
          - {name: "Google"}
          - {name: "GitHub"}
      Software:
        required:
          - {name: "Claude Code Security Review", aliases: ["Claude Code"]}
          - {name: "Gemini CLI Action", aliases: ["Gemini CLI"]}
          - {name: "GitHub Copilot Agent", aliases: ["Copilot Agent", "GitHub Copilot"]}
      Attack:
        # Untrusted GitHub content → agent (indirect). Plain PI also ok via alias.
        required:
          - {name: "Indirect Prompt Injection", aliases: ["Prompt Injection", "Comment and Control"]}
      Impact:
        # Core harm is secrets out via GitHub/Actions. ACE is from “executing arbitrary
        # commands” (Claude path) — real on page, but secondary to exfil.
        required:
          - {name: "Credential Theft"}
        acceptable:
          - {name: "Information Disclosure"}
          - {name: "Data Exfiltration"}
          - {name: "Arbitrary Code Execution", aliases: ["Remote Code Execution"]}

