  # ── Technical blog writeups ─────────────────────────────────────────────
  # Hand-vetted set: each URL was crawled + run through the full pipeline.
  # `vuln_id` is intentionally absent for most of these — research blogs
  # describe a named attack/finding, not a public CVE. We instead assert
  # presence of Vendor / Software / VulnerabilityType (CWE) classes.

  - url: https://embracethered.com/blog/posts/2024/chatgpt-hacking-memories/
    source: Embrace The Red
    category: tech-blog
    notes: Indirect prompt-injection abuses ChatGPT long-term memory
