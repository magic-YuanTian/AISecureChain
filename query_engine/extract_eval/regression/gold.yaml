          - {name: "Model Context Protocol", aliases: ["MCP"]}
      Attack:
        # Not Indirect PI — no untrusted natural-language → model path on this page.
        required:
          - {name: "Code Injection", aliases: ["Command Injection"]}
        acceptable:
          - {name: "Supply Chain Attack"}
          - {name: "Social Engineering"}
      Impact:
        required:
          - {name: "Remote Code Execution", aliases: ["Arbitrary Code Execution"]}
          - {name: "Persistence"}
        acceptable:
          # Page: “escalate privileges within the user context” + cloud creds / source —
