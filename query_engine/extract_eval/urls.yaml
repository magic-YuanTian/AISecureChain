# ─────────────────────────────────────────────────────────────────────────────
# AISecureChain — Extraction pipeline test URLs + gold expectations
# ─────────────────────────────────────────────────────────────────────────────
#
# Each entry defines what the pipeline should find on a given URL, so that
# `evaluate.py` can compute per-URL recall/precision/coverage.
#
# Categories:
#   single-cve   : one vulnerability on the page, strong expected ID
#   multi-cve    : listing pages (blog, advisory index, release notes)
#   software     : software/project page (no vuln needed; Vendor+Software expected)
#   partial      : page where we expect partial records / failure modes
#
# Expected fields (all optional; omit what you don't want to check):
#   vulnerability_ids       : list[str]   canonical IDs that must ALL appear
#   forbidden_ids           : list[str]   IDs that must NOT appear (anti-hallucination)
#   min_vulnerabilities     : int         minimum count of Vulnerability entities
#   min_vendors             : int
#   min_software            : int
#   min_versions            : int
#   min_vulnerability_types : int
#   must_have_classes       : list[str]   every listed ontology class must appear
#   max_partial_rate        : float       0-1, upper bound on partial_rate
#
# NOTE: Update IDs as you add/remove URLs. For listing pages, use a subset of
# IDs you are confident the page actually contains.
# ─────────────────────────────────────────────────────────────────────────────

urls:
  # ── Single CVE detail pages ─────────────────────────────────────────────
  - url: https://nvd.nist.gov/vuln/detail/CVE-2024-5184
    source: NVD
    category: single-cve
    notes: Salesforce EmailGPT prompt-injection
    expected:
      vulnerability_ids: [CVE-2024-5184]
      min_vendors: 1
      min_software: 1
      must_have_classes: [Vulnerability, Vendor, Software]
      max_partial_rate: 0.5

  - url: https://nvd.nist.gov/vuln/detail/CVE-2023-29374
    source: NVD
    category: single-cve
    notes: LangChain prompt injection (NVD page omits vendor field)
    expected:
      vulnerability_ids: [CVE-2023-29374]
      min_software: 1
      must_have_classes: [Vulnerability, Software]

  - url: https://nvd.nist.gov/vuln/detail/CVE-2023-36258
    source: NVD
    category: single-cve
    notes: LangChain PALChain command injection
    expected:
      vulnerability_ids: [CVE-2023-36258]
      must_have_classes: [Vulnerability, Software]

  # ── GitHub Security Advisories ──────────────────────────────────────────
  - url: https://github.com/advisories/GHSA-7gfq-f96f-g85j
    source: GitHub
    category: single-cve
    notes: LangChain SSRF
    expected:
      vulnerability_ids: [GHSA-7gfq-f96f-g85j]
      must_have_classes: [Vulnerability, Software]

  - url: https://github.com/advisories/GHSA-56xg-wfcc-g829
    source: GitHub
    category: single-cve
    notes: LangChain SQL injection
    expected:
      vulnerability_ids: [GHSA-56xg-wfcc-g829]

  # ── AVID records ────────────────────────────────────────────────────────
  - url: https://avidml.org/database/avid-2023-v013/
    source: AVID
    category: single-vuln
    notes: AI-specific advisory
    expected:
      vulnerability_ids: [AVID-2023-V013]
      must_have_classes: [Vulnerability]

  # ── Multi-record listing pages ──────────────────────────────────────────
  - url: https://owasp.org/www-project-top-10-for-large-language-model-applications/
    source: OWASP LLM Top 10
    category: taxonomy
    notes: Taxonomy page, expect many VulnerabilityType-like concepts
    expected:
