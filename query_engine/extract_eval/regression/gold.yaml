# =============================================================================
# Oracle-labeled ground truth for the extraction-pipeline regression benchmark.
# =============================================================================
#
# These labels were produced by reading the FROZEN fixture text (fixtures/*.md),
# acting as the oracle — not the upstream CSV summaries. Re-label if you rebuild
# a fixture (page content changed).
#
# Scoring model (see scorer.py). For each doc × ontology class we list:
#   required:   entities that SHOULD be extracted → drive RECALL.
#   acceptable: entities that are legitimately on the page but optional. A
#               predicted entity matching an acceptable item is NOT counted as a
#               false positive (so it never hurts precision) but does NOT add to
#               recall. This is what makes precision fair for fuzzy extraction:
#               `required` = must-have, `acceptable` = allowed, anything else a
#               predicted entity matches = false positive.
#
# An EMPTY required list with empty acceptable means "the pipeline must emit
# NOTHING of this class" — i.e. an anti-hallucination check (e.g. no CWE id is
# present in the text, so emitting a VulnerabilityType is a false positive).
#
# Entity item forms:
#   Vulnerability: {id: "CVE-..."}                      → match by normalized vuln_id
#                  {title_any: ["jailbreak", "abuse"]}  → match a Vulnerability whose
#                                                          id/title/description contains
#                                                          ANY keyword (for no-CVE findings)
#   other classes: {name: "X", aliases: ["Y", "Z"]}     → match predicted name vs name+aliases
# =============================================================================

